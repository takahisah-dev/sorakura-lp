=\"40\" fill=\"rgba(0,0,0,0.18)\"><\u002Frect>\n        <\u002Fg>\n\n        <!-- Pine branches silhouette top right -->\n        <g opacity=\"0.5\" fill=\"#2a221a\">\n          <ellipse cx=\"178\" cy=\"40\" rx=\"22\" ry=\"8\"><\u002Fellipse>\n          <ellipse cx=\"172\" cy=\"52\" rx=\"16\" ry=\"5\"><\u002Fellipse>\n        <\u002Fg>\n      <\u002Fsvg>\n      <div class=\"kura-caption\">\n<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"story-text\">\n      <p>鹿児島県の南東に位置する、人口約12,000人の肝付町。山と海に囲まれた、人の声がよく届く土地です。この場所で母は二十年以上にわたり「いろは味噌」という名前で、麦味噌を仕込んできました。蔵に立ち、麹と向き合い、季節と話す。それが、母の毎日でした。<\u002Fp>\n      <p>二〇二五年九月、息子である私は、母からこの伝統を受け継ぎ、いろは味噌から「そら蔵」としてリブランディングしました。製造は変わらず母が鹿児島で。経営とお届けは東京から息子が。場所は離れても、ひとつの食卓を囲むように、ひとつのブランドを育てています。<\u002Fp>\n      <p>この味を、もっと多くの食卓へ。家庭の小さな喜びに、麹のちからや添加物に頼らず、手作りの温かい味が寄り添えたら。そら蔵という名前には、土地と宇宙「そら」、そして家族の手仕事をつなぐ、わたしたちの願いが込められています。<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ PRODUCTS ============ -->\n<section class=\"block\">\n  <div class=\"label\">— ラインナップ —<\u002Fdiv>\n  <h2 class=\"section-title\">そら蔵の調味料<\u002Fh2>\n  <div class=\"products-grid\">\n\n    <article class=\"card\">\n      <div class=\"card-visual v-5\">\n        <div class=\"badge\">そら蔵の顔<\u002Fdiv>\n        <div class=\"glyph\">麦<\u002Fdiv>\n        <img class=\"sk-photo\" src=\"data:image/webp;base64,UklGRvo/AABXRUJQVlA4WAoAAAAgAAAApwIApwIASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAA
